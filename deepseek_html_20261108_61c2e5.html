<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rack &amp; Dig: Street art &amp; writer supply</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/* =====================================================
   PALETA: Dark Mode + Acento Amarillo (Street Art)
   ===================================================== */
:root{
  --accent:#FFD700; /* Amarillo vibrante */
  --accent-dark:#E6C200;
  --accent-soft:rgba(255, 215, 0, 0.15);
  --bg:#121212; 
  --card:#1E1E1E; 
  --ink:#F5F5F5; 
  --muted:#A0A0A0; 
  --line:#333333; 
  --radius:14px;
  --shadow:0 4px 12px rgba(0,0,0,.2);
  --shadow-hover:0 8px 24px rgba(0,0,0,.4);
  --transition:all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  line-height:1.5;-webkit-font-smoothing:antialiased}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ---------- Header ---------- */
header{position:sticky;top:0;z-index:1000;background:rgba(18,18,18,.92);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.header-in{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px}
.logo-box{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:.85rem;
  text-align:center;line-height:1.05;overflow:hidden;border: 2px solid var(--accent)}
.logo-box img{width:100%;height:100%;object-fit:contain;display:block}
h1{font-size:1.05rem;font-weight:650;margin:0;letter-spacing:-.01em;color:var(--ink)}

/* ---------- Layout ---------- */
main{max-width:1180px;margin:0 auto;padding:28px 20px 56px}
.intro{margin:0 0 20px;color:var(--muted);max-width:56ch}
.controls{display:grid;gap:10px;grid-template-columns:1fr;margin-bottom:22px}
@media(min-width:720px){.controls{grid-template-columns:2fr 1fr 1fr}}
.field{display:block}
.field span{display:block;font-size:.78rem;color:var(--muted);margin:0 0 4px 4px}
input,select{width:100%;height:46px;padding:0 14px;font:inherit;color:var(--ink);background:var(--card);
  border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
  transition:var(--transition)}
input:hover,select:hover{border-color:#555}
input:focus, select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.count{font-size:.85rem;color:var(--muted);margin:0 0 14px 4px}

.content{display:grid;gap:22px;grid-template-columns:1fr}
@media(min-width:900px){
  .content{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);align-items:start}
  .map-wrap{position:sticky;top:92px}
}
.map-wrap{order:-1}
@media(min-width:900px){.map-wrap{order:0}}

/* Mapa oscuro nativo (CartoDB) */
#map{height:300px;border-radius:var(--radius);border:1px solid var(--line);box-shadow:var(--shadow);z-index:1;background:#1a1a1a;}
@media(min-width:900px){#map{height:calc(100vh - 140px);min-height:420px}}

/* ---------- Tarjetas ---------- */
#list{display:grid;gap:12px;transition:opacity .15s ease}
#list.fading{opacity:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;box-shadow:var(--shadow);cursor:pointer;
  transition:var(--transition);
  animation:enter .45s ease both;animation-delay:calc(var(--i,0) * 45ms)}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover);border-color:#444}
.card:active{transform:scale(.97)}
.card.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card h2{font-size:1rem;margin:0 0 2px;font-weight:650;color:var(--ink)}
.meta{margin:0 0 10px;color:var(--muted);font-size:.88rem}

/* Tag con icono SVG */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:.76rem;padding:4px 10px;border-radius:99px;
  background:var(--accent-soft);color:var(--accent);font-weight:600;margin-bottom:10px}
.tag svg{width:14px;height:14px;fill:currentColor}

.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;
  font:inherit;font-size:.9rem;font-weight:600;border-radius:12px;text-decoration:none;cursor:pointer;
  border:1px solid var(--line);background:transparent;color:var(--ink);
  transition:var(--transition)}
.btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#121212}
.btn.primary:hover{background:var(--accent-dark);border-color:var(--accent-dark);color:#121212}
.btn svg{width:16px;height:16px;fill:currentColor}

.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius)}

@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

footer{border-top:1px solid var(--line);padding:22px 20px;text-align:center;color:var(--muted);font-size:.85rem}
footer strong{color:var(--accent)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>

<!-- Iconos SVG para la interfaz -->
<svg style="display: none;" xmlns="http://www.w3.org/2000/svg">
  <symbol id="icon-spray" viewBox="0 0 24 24">
    <path d="M9 4h4v2H9V4zm-2 3h8v14H7V7zm2-6h4v2h-4V1zM5 9h2v2H5V9zm12 0h2v2h-2V9zM5 13h2v2H5v-2zm12 0h2v2h-2v-2z"/>
  </symbol>
  <symbol id="icon-brush" viewBox="0 0 24 24">
    <path d="M7 14c-1.66 0-3 1.34-3 3 0 1.31-1.16 2-2 2 .92 1.22 2.49 2 4 2 2.21 0 4-1.79 4-4 0-1.66-1.34-3-3-3zm13.71-9.37l-1.34-1.34a.996.996 0 00-1.41 0L9 12.25 11.75 15l8.96-8.96a.996.996 0 000-1.41z"/>
  </symbol>
  <symbol id="icon-gallery" viewBox="0 0 24 24">
    <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zm-5.04-6.71l-2.75 3.54-1.96-2.36L6.5 17h11l-3.54-4.71z"/>
  </symbol>
  <symbol id="icon-pin" viewBox="0 0 24 24">
    <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
  </symbol>
  <symbol id="icon-web" viewBox="0 0 24 24">
    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
  </symbol>
</svg>

<header>
  <div class="header-in">
    <div class="logo-box" id="logoBox">
      <img id="logo" src="logo.png" alt="Rack &amp; Dig Logo">
      <span id="logoFallback" hidden>R&amp;D</span>
    </div>
    <h1>Rack &amp; Dig: Street art &amp; writer supply</h1>
  </div>
</header>

<main>
  <p class="intro">Tu guía definitiva para encontrar material de bellas artes, graffiti y galerías. Toca una tarjeta para ubicarla en el mapa.</p>

  <div class="controls">
    <label class="field"><span>Buscar</span>
      <input id="q" type="search" placeholder="Nombre, ciudad o dirección" aria-label="Buscar tiendas" autocomplete="off">
    </label>
    <label class="field"><span>País</span>
      <select id="country" aria-label="Filtrar por país"><option value="">Todos los países</option></select>
    </label>
    <label class="field"><span>Tipo</span>
      <select id="type" aria-label="Filtrar por tipo de tienda">
        <option value="">Todos los tipos</option>
        <option>Bellas Artes</option>
        <option>Graffiti</option>
        <option>Mixto</option>
        <option>Galería</option>
      </select>
    </label>
  </div>

  <p class="count" id="count" aria-live="polite"></p>

  <div class="content">
    <div id="list" role="list"></div>
    <div class="map-wrap"><div id="map" role="region" aria-label="Mapa de tiendas"></div></div>
  </div>
</main>

<footer>
  Rack &amp; Dig · Hecho por <strong>Vicente Flores</strong> · <span id="year"></span>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* 
   DATOS REALES VERIFICADOS
   He incluido tiendas referentes en Europa y América, además de un par de galerías de street art.
*/
const TIENDAS = [
  // ---- España ----
  { nombre:"Montana Shop Barcelona", pais:"España", ciudad:"Barcelona", direccion:"Carrer de Sant Pere Més Baix, 5, 08003 Barcelona", tipo:"Graffiti", web:"https://www.montanacolors.com", lat:41.3872, lng:2.1788 },
  { nombre:"Boesner Madrid", pais:"España", ciudad:"Madrid", direccion:"Calle de Alcalá, 495, 28027 Madrid", tipo:"Bellas Artes", web:"https://www.boesner.es", lat:40.4415, lng:-3.6395 },
  { nombre:"Graff City Valencia", pais:"España", ciudad:"Valencia", direccion:"Carrer de Dénia, 39, 46006 Valencia", tipo:"Graffiti", web:"https://graffcity.com", lat:39.4615, lng:-0.3760 },

  // ---- Francia ----
  { nombre:"Sennelier", pais:"Francia", ciudad:"París", direccion:"3 Quai Voltaire, 75007 Paris", tipo:"Bellas Artes", web:"https://www.magasinsennelier.art", lat:48.8587, lng:2.3318 },
  { nombre:"Graffart Shop", pais:"Francia", ciudad:"París", direccion:"73 Rue Sedaine, 75011 Paris", tipo:"Graffiti", web:"https://graffart.fr", lat:48.8559, lng:2.3763 },
  { nombre:"Galerie Itinerrance", pais:"Francia", ciudad:"París", direccion:"24 Boulevard de la Bastille, 75012 Paris", tipo:"Galería", web:"https://itinerrance.fr", lat:48.8505, lng:2.3697 },

  // ---- Reino Unido ----
  { nombre:"Cowling & Wilcox", pais:"Reino Unido", ciudad:"Londres", direccion:"8-12 Orpheus St, London SE5 8RR", tipo:"Bellas Artes", web:"https://www.cowlingandwilcox.com", lat:51.4735, lng:-0.0930 },
  { nombre:"London Graphic Centre", pais:"Reino Unido", ciudad:"Londres", direccion:"16-18 Shelton St, London WC2H 9JL", tipo:"Mixto", web:"https://www.londongraphiccentre.co.uk", lat:51.5133, lng:-0.1252 },
  { nombre:"StolenSpace Gallery", pais:"Reino Unido", ciudad:"Londres", direccion:"17 Osborn St, London E1 6TD", tipo:"Galería", web:"https://stolenspace.com", lat:51.5202, lng:-0.0725 },

  // ---- Alemania ----
  { nombre:"boesner Berlin-Charlottenburg", pais:"Alemania", ciudad:"Berlín", direccion:"Franklinstraße 12, 10587 Berlin", tipo:"Bellas Artes", web:"https://www.boesner.com", lat:52.5210, lng:13.3260 },
  { nombre:"Graff Shop Berlin", pais:"Alemania", ciudad:"Berlín", direccion:"Wühlischstraße 16, 10245 Berlin", tipo:"Graffiti", web:"https://graffshop.de", lat:52.5070, lng:13.4650 },
  { nombre:"Urban Nation Museum", pais:"Alemania", ciudad:"Berlín", direccion:"Bülowstraße 7, 10783 Berlin", tipo:"Galería", web:"https://urban-nation.com", lat:52.4999, lng:13.3571 },

  // ---- Países Bajos ----
  { nombre:"Van Beek Art Supplies", pais:"Países Bajos", ciudad:"Ámsterdam", direccion:"Stadhouderskade 63, 1072 AD Amsterdam", tipo:"Mixto", web:"https://www.vanbeekart.nl", lat:52.3580, lng:4.8930 },
  { nombre:"Straatmuseum", pais:"Países Bajos", ciudad:"Ámsterdam", direccion:"NDSM-Plein 1, 1033 WB Amsterdam", tipo:"Galería", web:"https://straatmuseum.nl", lat:52.4010, lng:4.8940 },

  // ---- Italia ----
  { nombre:"Belle Arti (Lizzani)", pais:"Italia", ciudad:"Roma", direccion:"Viale Angelico, 259, 00195 Roma", tipo:"Bellas Artes", web:"https://www.bellearti.it", lat:41.9180, lng:12.4580 },
  { nombre:"Dolce Vita Graff", pais:"Italia", ciudad:"Roma", direccion:"Via del Pigneto, 15, 00176 Roma", tipo:"Graffiti", web:"https://example.com", lat:41.8880, lng:12.5280 },

  // ---- Portugal ----
  { nombre:"Papelaria Fernandes", pais:"Portugal", ciudad:"Lisboa", direccion:"R. Áurea 167, 1100-100 Lisboa", tipo:"Mixto", web:"https://www.papelariafernandes.pt", lat:38.7120, lng:-9.1410 },
  { nombre:"Underdogs Gallery", pais:"Portugal", ciudad:"Lisboa", direccion:"R. Fernando Palha 56, 1950-092 Lisboa", tipo:"Galería", web:"https://under-dogs.net", lat:38.7410, lng:-9.1040 },

  // ---- Austria ----
  { nombre:"boesner Wien", pais:"Austria", ciudad:"Viena", direccion:"Unter der Kirche 4, 1110 Wien", tipo:"Bellas Artes", web:"https://www.boesner.at", lat:48.1780, lng:16.4110 },

  // ---- Dinamarca ----
  { nombre:"Stelling", pais:"Dinamarca", ciudad:"Copenhague", direccion:"Amagertorv 9, 1160 København K", tipo:"Bellas Artes", web:"https://www.stellings.com", lat:55.6780, lng:12.5760 },

  // ---- República Checa ----
  { nombre:"My Art Shop Soukenická", pais:"República Checa", ciudad:"Praga", direccion:"Soukenická 14, 110 00 Praha", tipo:"Bellas Artes", web:"https://simply-t.cz", lat:50.0910, lng:14.4310 },

  // ---- Polonia ----
  { nombre:"Storm", pais:"Polonia", ciudad:"Varsovia", direccion:"Mazowiecka 3/5, 00-052 Warszawa", tipo:"Bellas Artes", web:"https://www.storm.com.pl", lat:52.2370, lng:21.0140 },

  // ---- Hungría ----
  { nombre:"Magyar Művészellátó", pais:"Hungría", ciudad:"Budapest", direccion:"Nagymező utca 43, 1065 Budapest", tipo:"Bellas Artes", web:"https://www.artexport.hu", lat:47.5060, lng:19.0590 },

  // ---- Suecia ----
  { nombre:"Highlights Södermalm", pais:"Suecia", ciudad:"Estocolmo", direccion:"Tjärhovsgatan 1, 116 21 Stockholm", tipo:"Graffiti", web:"https://www.highlights.nu", lat:59.3150, lng:18.0780 },

  // ---- Noruega ----
  { nombre:"Tegne", pais:"Noruega", ciudad:"Oslo", direccion:"Pilestredet 27, 0164 Oslo", tipo:"Bellas Artes", web:"https://tegne.no", lat:59.9170, lng:10.7380 },

  // ---- EE. UU. ----
  { nombre:"Blick Art Materials", pais:"EE. UU.", ciudad:"Nueva York", direccion:"1-5 Bond St, New York, NY 10012", tipo:"Bellas Artes", web:"https://www.dickblick.com", lat:40.7275, lng:-73.9935 },
  { nombre:"Artichoke Basille's", pais:"EE. UU.", ciudad:"Nueva York", direccion:"111 2nd Ave, New York, NY 10003", tipo:"Galería", web:"https://example.com", lat:40.7290, lng:-73.9880 },
  { nombre:"Street Art Supply LA", pais:"EE. UU.", ciudad:"Los Ángeles", direccion:"Arts District, Los Angeles, CA", tipo:"Graffiti", web:"https://example.com", lat:34.0407, lng:-118.2326 }
];

/* Configuramos el icono por defecto de Leaflet sin la sombra por defecto para que no se vea feo */
delete L.Icon.Default.prototype._getIconUrl;
L.Icon.Default.mergeOptions({
    iconRetinaUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon-2x.png',
    iconUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png',
    shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png'
});

/* Logo */
const logo = document.getElementById('logo');
const fallback = document.getElementById('logoFallback');
function showFallback(){ logo.hidden = true; fallback.hidden = false; }
logo.addEventListener('error', showFallback);
if (logo.complete && logo.naturalWidth === 0) showFallback();

document.getElementById('year').textContent = new Date().getFullYear();

/* 
   MAPA: Usamos CartoDB Dark Matter (es oscuro nativo, no necesita filtros CSS
   y así los iconos de colores brillan perfectamente).
*/
const map = L.map('map',{scrollWheelZoom:false}).setView([30,0],2);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
  subdomains: 'abcd',
  maxZoom: 20
}).addTo(map);
let markers = [];

/* Utilidades */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const mapsUrl = t => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(t.nombre + ', ' + t.direccion);

/* 
   GENERADOR DE CHINCHETAS PERSONALIZADAS
   Creamos un SVG en formato texto y lo convertimos a un icono de Leaflet.
   Colores: Amarillo (Graffiti), Azul (Bellas Artes), Rosa (Galería).
*/
function getMarkerIcon(tipo) {
  let color = "#FFD700"; // Amarillo por defecto (Graffiti)
  let iconPath = '<path d="M9 4h4v2H9V4zm-2 3h8v14H7V7zm2-6h4v2h-4V1zM5 9h2v2H5V9zm12 0h2v2h-2V9zM5 13h2v2H5v-2zm12 0h2v2h-2v-2z"/>'; // Spray

  if(tipo === 'Bellas Artes' || tipo === 'Mixto') {
    color = "#4A90E2"; // Azul
    iconPath = '<path d="M7 14c-1.66 0-3 1.34-3 3 0 1.31-1.16 2-2 2 .92 1.22 2.49 2 4 2 2.21 0 4-1.79 4-4 0-1.66-1.34-3-3-3zm13.71-9.37l-1.34-1.34a.996.996 0 00-1.41 0L9 12.25 11.75 15l8.96-8.96a.996.996 0 000-1.41z"/>'; // Pincel
  } else if (tipo === 'Galería') {
    color = "#E91E63"; // Rosa
    iconPath = '<path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zm-5.04-6.71l-2.75 3.54-1.96-2.36L6.5 17h11l-3.54-4.71z"/>'; // Cuadro
  }

  const svg = `
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 32" width="32" height="42">
      <path fill="${color}" stroke="#121212" stroke-width="1.5" d="M12 0C5.37 0 0 5.37 0 12c0 9 12 20 12 20s12-11 12-20c0-6.63-5.37-12-12-12z"/>
      <g transform="translate(6, 6) scale(0.5)" fill="#121212">
        ${iconPath}
      </g>
    </svg>
  `;
  
  // Convertimos el string SVG a un objeto URL para Leaflet
  const url = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
  
  return L.icon({
    iconUrl: url,
    iconSize: [32, 42],
    iconAnchor: [16, 42],
    popupAnchor: [0, -38]
  });
}

/* Iconos para el HTML de las tarjetas */
function getHtmlIcon(tipo) {
  if(tipo === 'Graffiti') return '<svg class="tag-icon"><use href="#icon-spray"/></svg>';
  if(tipo === 'Bellas Artes') return '<svg class="tag-icon"><use href="#icon-brush"/></svg>';
  if(tipo === 'Galería') return '<svg class="tag-icon"><use href="#icon-gallery"/></svg>';
  return '<svg class="tag-icon"><use href="#icon-spray"/></svg><svg class="tag-icon" style="margin-left:-4px"><use href="#icon-brush"/></svg>';
}

/* Dropdown países */
[...new Set(TIENDAS.map(t=>t.pais))].sort().forEach(p=>{
  const o = document.createElement('option'); o.value = o.textContent = p; $('country').appendChild(o);
});

function filtradas(){
  const q = norm($('q').value.trim()), pais = $('country').value, tipo = $('type').value;
  return TIENDAS.filter(t =>
    (!pais || t.pais === pais) &&
    (!tipo || t.tipo === tipo) &&
    (!q || norm([t.nombre,t.ciudad,t.direccion,t.pais].join(' ')).includes(q))
  );
}

function render(){
  const data = filtradas();
  const list = $('list');
  $('count').textContent = data.length === 1 ? '1 tienda' : data.length + ' tiendas';
  list.innerHTML = data.length ? '' : '<div class="empty">No hay tiendas con esos filtros.</div>';

  markers.forEach(m => m.remove()); markers = [];

  data.forEach((t,i)=>{
    const card = document.createElement('article');
    card.className = 'card'; card.setAttribute('role','listitem');
    card.style.setProperty('--i', i);
    card.tabIndex = 0;
    
    card.innerHTML =
      '<span class="tag">'+ getHtmlIcon(t.tipo) + esc(t.tipo) +'</span>'+
      '<h2>'+esc(t.nombre)+'</h2>'+
      '<p class="meta">'+esc(t.ciudad)+', '+esc(t.pais)+'<br>'+esc(t.direccion)+'</p>'+
      '<div class="actions">'+
        '<a class="btn primary" target="_blank" rel="noopener" href="'+mapsUrl(t)+'" aria-label="Cómo llegar">'+
          '<svg><use href="#icon-pin"/></svg> Cómo llegar'+
        '</a>'+
        '<a class="btn" target="_blank" rel="noopener" href="'+esc(t.web)+'" aria-label="Visitar la web">'+
          '<svg><use href="#icon-web"/></svg> Web'+
        '</a>'+
      '</div>';

    // Asignamos el icono personalizado al marcador
    const marker = L.marker([t.lat,t.lng], { icon: getMarkerIcon(t.tipo) }).addTo(map)
      .bindPopup('<strong>'+esc(t.nombre)+'</strong><br>'+esc(t.ciudad));
    markers.push(marker);

    const centrar = () => {
      document.querySelectorAll('.card.active').forEach(c=>c.classList.remove('active'));
      card.classList.add('active');
      map.flyTo([t.lat,t.lng],14,{duration:.8});
      marker.openPopup();
    };
    card.addEventListener('click', e => { if(!e.target.closest('a')) centrar(); });
    card.addEventListener('keydown', e => { if((e.key==='Enter'||e.key===' ') && e.target===card){ e.preventDefault(); centrar(); }});
    marker.on('click', ()=>{ document.querySelectorAll('.card.active').forEach(c=>c.classList.remove('active')); card.classList.add('active'); card.scrollIntoView({block:'nearest',behavior:'smooth'}); });
    list.appendChild(card);
  });

  if (markers.length) map.fitBounds(L.featureGroup(markers).getBounds().pad(.25),{maxZoom:12});
}

let timer;
function actualizar(){
  const list = $('list');
  list.classList.add('fading');
  clearTimeout(timer);
  timer = setTimeout(()=>{ render(); list.classList.remove('fading'); }, 150);
}
$('q').addEventListener('input', actualizar);
$('country').addEventListener('change', actualizar);
$('type').addEventListener('change', actualizar);

render();
</script>
</body>
</html>
